name: Sky Check-in

# 瑙﹀彂锛氭瘡澶╁寳浜椂闂?08:10 璺戜竴娆★紱涔熷彲浠ユ墜鍔ㄧ偣杩愯
# 娉ㄦ剰 cron 鏄?UTC銆傚寳浜椂闂?= UTC+8锛屾墍浠?00:10 UTC 瀵瑰簲 08:10 CST
on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sky-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python version
        run: python3 -V

      - name: Run check-in
        shell: bash
        env:
          SKY_ACCOUNTS: ${{ secrets.SKY_ACCOUNTS }}
          SKY_ALT_IP: ${{ vars.SKY_ALT_IP }}
          SKY_WEBHOOK: ${{ secrets.SKY_WEBHOOK }}
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          python3 qinglong/sky-checkin.py 2>&1 | tee run.log

      - name: Failure annotation
        if: failure()
        shell: bash
        run: |
          msg="$(tail -n 3 run.log 2>/dev/null | tr '\n' ' ')"
          echo "::error title=Sky 签到失败::${msg:-没有日志}"
          tail -n 40 run.log 2>/dev/null || true

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Sky 绛惧埌缁撴灉'
            echo ''
            echo '```'
            tail -n 40 run.log 2>/dev/null || echo '(娌℃湁鏃ュ織)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


